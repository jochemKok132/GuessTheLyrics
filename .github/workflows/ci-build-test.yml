name: CI build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GuessTheLyrics.slnx

      - name: Build
        run: dotnet build GuessTheLyrics.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GuessTheLyrics.slnx --configuration Release --no-build --verbosity normal
