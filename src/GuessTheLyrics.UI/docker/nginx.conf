# nginx inside the UI container. The host nginx proxies /guessthelyrics/ to this server with the prefix stripped.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/wasm application/javascript application/json application/octet-stream text/css;

    # Blazor routes (/play/123, /players/...) are client-side: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate index.html and settings, so a new release is picked up immediately.
    # The framework files are fingerprinted, so they can be cached normally.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/appsettings.*\.json$ {
        add_header Cache-Control "no-cache";
    }
}
