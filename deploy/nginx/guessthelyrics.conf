# Include inside the jochemkok.nl server { } block of the host nginx, e.g.
#   include /etc/nginx/snippets/guessthelyrics.conf;
# Ports must match API_PORT and UI_PORT in /opt/guessthelyrics/.env.

location = /guessthelyrics {
    return 301 /guessthelyrics/;
}

# API: /guessthelyrics/api/... → container /api/...
location /guessthelyrics/api/ {
    proxy_pass http://127.0.0.1:5090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Blazor UI: /guessthelyrics/... → container /...
location /guessthelyrics/ {
    proxy_pass http://127.0.0.1:5091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
