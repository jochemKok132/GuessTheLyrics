# GuessTheLyrics on the server. Lives in /opt/guessthelyrics together with .env and update.sh.
# Images come from GitHub Releases (see .github/workflows/release.yml); update.sh switches APP_VERSION.
name: guessthelyrics

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
      # Backups made by update.sh before every update.
      - ./backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: ghcr.io/jochemkok132/guessthelyrics-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=GuessTheLyrics;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Frontend__AllowedOrigins__0: ${PUBLIC_ORIGIN:-https://jochemkok.nl}
    # Only reachable from the host; the host nginx is the public entrance.
    ports:
      - "127.0.0.1:${API_PORT:-5090}:8080"

  ui:
    image: ghcr.io/jochemkok132/guessthelyrics-ui:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      BASE_PATH: ${BASE_PATH:-/guessthelyrics/}
    ports:
      - "127.0.0.1:${UI_PORT:-5091}:8080"

volumes:
  db-data:
